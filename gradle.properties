# Gradle
# ⚠️ 本机仅 13GB 物理内存，-Xmx8g 会导致 JVM 原生 OOM（崩溃症状极具迷惑性：EXIT=127、
# 日志戛然而止、或报 "daemon has been stopped: stop command received"，看着像被外部杀进程，
# 实际是 malloc 失败；确诊看工程根的 hs_err_pid*.log）。降到 4g，并显式给 Kotlin daemon 封顶。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configureondemand=false
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Incremental compilation
kotlin.incremental=true
kotlin.incremental.multiplatform=true
# 关闭 Build Tools API 编译路径，避免 Kotlin 2.x 在并行编译时
# 复用同一 FilePageCache 导致的 "Storage already registered" 增量缓存错误。
kotlin.compiler.runViaBuildToolsApi=false
