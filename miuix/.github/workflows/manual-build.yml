# 手动构建 miuix Demo（网页版 + 安卓版）
#
# 用法：Fork 本仓库后，进入 Actions → 选「Manual Build Demo」→ Run workflow
#   target 选 web  → 产出网页版（Wasm + JS 两份静态文件，可直接 GitHub Pages 或本地起服务打开）
#   target 选 android → 产出 debug APK
#
# 产物在本次运行页面的 Artifacts 区下载。

name: Manual Build Demo

on:
  workflow_dispatch:
    inputs:
      target:
        description: 构建目标
        type: choice
        default: all
        options:
          - all
          - web
          - android

jobs:
  build-web:
    if: ${{ inputs.target == 'all' || inputs.target == 'web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 仅作为 Gradle 启动器 JVM；构建守护进程按
      # gradle/gradle-daemon-jvm.properties 自动获取 JetBrains Runtime 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (带缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web (Wasm + JS)
        run: ./gradlew :example:web:wasmJsBrowserDistribution :example:web:jsBrowserDistribution --console=plain

      - name: Upload Wasm 产物
        uses: actions/upload-artifact@v4
        with:
          name: miuix-demo-web-wasm
          path: example/web/build/dist/wasmJs/productionExecutable/

      - name: Upload JS 产物
        uses: actions/upload-artifact@v4
        with:
          name: miuix-demo-web-js
          path: example/web/build/dist/js/productionExecutable/

  build-android:
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle (带缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: ./gradlew :example:android:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miuix-demo-android-apk
          path: example/android/build/outputs/apk/debug/*.apk
