name: Multi-Platform Build

# 手动触发：在 Actions 页面勾选想编的平台即可自由组合
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Android（APK）"
        type: boolean
        default: true
      ios:
        description: "iOS（未签名 ipa · 需先实装 iosMain）"
        type: boolean
        default: false
      windows:
        description: "Windows（需先实装桌面端 jvmMain）"
        type: boolean
        default: false
      macos:
        description: "macOS（需先实装桌面端 jvmMain）"
        type: boolean
        default: false
      linux:
        description: "Linux（需先实装桌面端 jvmMain）"
        type: boolean
        default: false
      build_type:
        description: "构建类型（Android 用）"
        type: choice
        default: release
        options:
          - release
          - debug

concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ───────────────────────── Android ─────────────────────────
  android:
    name: Android APK
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 仓库没有 wrapper，直接装指定版本 Gradle
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      # 素材走私有仓库 Klee7792/nainiuzhen-assets（main 分支根的 assets.pack，NZPK v2）。
      # 公开仓库不含任何游戏素材：缺包 = 启动即空数据，故 PAT 缺失/拉取失败一律终止构建。
      # PAT 要求：fine-grained，仅授权 nainiuzhen-assets 仓库，Contents: Read-only。
      - name: Fetch game assets pack
        env:
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
        run: |
          if [ -z "${ASSETS_PAT}" ]; then
            echo "::error::未配置 Secret ASSETS_PAT（网页生成 fine-grained PAT 后存入本仓库 Secrets）"
            exit 1
          fi
          mkdir -p app/src/main/assets
          code=$(curl -sSL -w '%{http_code}' -o app/src/main/assets/assets.pack \
            -H "Authorization: Bearer ${ASSETS_PAT}" \
            https://raw.githubusercontent.com/Klee7792/nainiuzhen-assets/main/assets.pack)
          if [ "${code}" != "200" ]; then
            echo "::error::assets.pack 拉取失败（HTTP ${code}）：检查 PAT 是否只授了 nainiuzhen-assets、私有仓 main 分支是否存在该文件"
            exit 1
          fi
          if ! head -c 4 app/src/main/assets/assets.pack | grep -q "NZPK"; then
            echo "::error::assets.pack 魔数校验失败（非 NZPK 容器，可能下载到错误页）"
            exit 1
          fi
          echo "::notice::assets.pack 注入完成：$(wc -c < app/src/main/assets/assets.pack) 字节"

      - name: Build
        run: >-
          gradle :app:assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
          --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nainiuzhen-baike-android-${{ inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ───────────────────────── iOS（占位） ─────────────────────────
  ios:
    name: iOS ipa
    if: ${{ inputs.ios }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Target check
        run: |
          if [ ! -d shared/src/iosMain ]; then
            echo "::error::iOS 目标尚未实装（shared/src/iosMain 不存在）。完成 KMP iOS 化后再勾选此项。"
            exit 1
          fi

      # TODO: 实装 iosMain 后启用
      # - uses: actions/setup-java@v4 (temurin 21)
      # - gradle :shared:linkReleaseFrameworkIosArm64 / IosSimulatorArm64
      # - xcodebuild 打包未签名 ipa → actions/upload-artifact

  # ─────────────────── 桌面端（占位，共用检查） ───────────────────
  desktop-windows:
    name: Windows exe
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target check
        shell: bash
        run: |
          if [ ! -d shared/src/jvmMain ]; then
            echo "::error::桌面端（Compose Desktop / shared/src/jvmMain）尚未实装。"
            exit 1
          fi
      # TODO: gradle packageExe（installMSI/packageDistributionForCurrentTests）→ 上传

  desktop-macos:
    name: macOS dmg
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target check
        run: |
          if [ ! -d shared/src/jvmMain ]; then
            echo "::error::桌面端（Compose Desktop / shared/src/jvmMain）尚未实装。"
            exit 1
          fi
      # TODO: gradle packageDmg → 上传

  desktop-linux:
    name: Linux deb/AppImage
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target check
        run: |
          if [ ! -d shared/src/jvmMain ]; then
            echo "::error::桌面端（Compose Desktop / shared/src/jvmMain）尚未实装。"
            exit 1
          fi
      # TODO: gradle packageDeb packageAppImage → 上传
