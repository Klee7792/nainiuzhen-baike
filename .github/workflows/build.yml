name: Multi-Platform Build

# 勾选「版本 +1」时，version job 会把新号回写台账并 push 回当前分支，故需要写权限。
permissions:
  contents: write

# 手动触发：在 Actions 页面勾选想编的平台即可自由组合
on:
  workflow_dispatch:
    inputs:
      android:
        description: "Android（APK）"
        type: boolean
        default: true
      ios:
        description: "iOS（未签名 ipa · 巨魔侧载）"
        type: boolean
        default: false
      windows:
        description: "Windows（需先实装桌面端 jvmMain）"
        type: boolean
        default: false
      macos:
        description: "macOS（需先实装桌面端 jvmMain）"
        type: boolean
        default: false
      linux:
        description: "Linux（需先实装桌面端 jvmMain）"
        type: boolean
        default: false
      build_type:
        description: "构建类型（Android 用）"
        type: choice
        default: release
        options:
          - release
          - debug
      bump_version:
        description: "版本 +1（发布新版本；不勾 = 同版本重构建，版本名带提交号）"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # ─────────────────── 版本号（算号 + 回写台账） ───────────────────
  # 台账文件（唯一来源）：
  #   builds/build_number.txt      = Android 当前版本 code（十进制：百位.十位.个位）
  #   builds/ios_build_number.txt  = iOS     当前版本 code
  # 版本名把 code 当作「百位.十位.个位」：name = "${code/100+1}.${code%100/10}.${code%10}"
  # （0→1.0.0 / 9→1.0.9 / 10→1.1.0 / 38→1.3.8 / 39→1.3.9 / 100→2.0.0）。
  #
  # 勾选 bump_version：两个 code 各 +1，并把新值回写文件、提交 push（[skip ci]）；
  #                     push 失败即让整个 job 失败（宁可早失败，也不静默产出重复版本号）。
  # 不勾选：code 不变，版本名追加 -<7 位短 sha>，便于同版本重复构建时区分产物。
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      android_code: ${{ steps.ver.outputs.android_code }}
      android_name: ${{ steps.ver.outputs.android_name }}
      ios_code: ${{ steps.ver.outputs.ios_code }}
      ios_name: ${{ steps.ver.outputs.ios_name }}
      bumped: ${{ steps.ver.outputs.bumped }}
      short_sha: ${{ steps.ver.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute & bump version
        id: ver
        run: |
          set -euo pipefail

          # code → 版本名（百位.十位.个位 十进制进位）
          name_of() {
            local code="$1"
            echo "$((code / 100 + 1)).$((code % 100 / 10)).$((code % 10))"
          }

          short_sha="${GITHUB_SHA:0:7}"

          # 读取当前台账值（只保留数字，容忍换行/空白）
          android="$(tr -dc '0-9' < builds/build_number.txt)"
          ios="$(tr -dc '0-9' < builds/ios_build_number.txt)"
          if [ -z "${android}" ] || [ -z "${ios}" ]; then
            echo "::error::台账文件为空或读取失败（builds/build_number.txt=${android} / builds/ios_build_number.txt=${ios}）"
            exit 1
          fi

          bumped="${{ inputs.bump_version }}"
          if [ "${bumped}" = "true" ]; then
            android=$((android + 1))
            ios=$((ios + 1))
            # 回写台账：勾选 +1 时必须落盘，否则下次 +1 会算出同一个号
            printf '%s\n' "${android}" > builds/build_number.txt
            printf '%s\n' "${ios}" > builds/ios_build_number.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add builds/build_number.txt builds/ios_build_number.txt
            git commit -m "chore: bump version (android ${android} / ios ${ios}) [skip ci]"
            echo "::notice::版本 +1 已回写台账：android code=${android} / ios code=${ios}，准备 push"
            git push origin "HEAD:${{ github.ref_name }}"
            echo "::notice::台账回写已推送到 ${{ github.ref_name }}"
          fi

          android_name="$(name_of "${android}")"
          ios_name="$(name_of "${ios}")"
          if [ "${bumped}" != "true" ]; then
            # 同版本重构建：版本名带短 sha，用产物名即可区分
            android_name="${android_name}-${short_sha}"
            ios_name="${ios_name}-${short_sha}"
          fi

          {
            echo "android_code=${android}"
            echo "android_name=${android_name}"
            echo "ios_code=${ios}"
            echo "ios_name=${ios_name}"
            echo "bumped=${bumped}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Android 版本 = ${android_name} (code ${android}) · iOS 版本 = ${ios_name} (code ${ios}) · bumped=${bumped}"

  # ───────────────────────── Android ─────────────────────────
  android:
    name: Android APK
    needs: version
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 仓库没有 wrapper，直接装指定版本 Gradle
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      # 素材走私有仓库 Klee7792/nainiuzhen-assets（main 分支根的 assets.pack，NZPK v2）。
      # 公开仓库不含任何游戏素材：缺包 = 启动即空数据，故 PAT 缺失/拉取失败一律终止构建。
      # PAT 要求：fine-grained，仅授权 nainiuzhen-assets 仓库，Contents: Read-only。
      - name: Fetch game assets pack
        env:
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
        run: |
          if [ -z "${ASSETS_PAT}" ]; then
            echo "::error::未配置 Secret ASSETS_PAT（网页生成 fine-grained PAT 后存入本仓库 Secrets）"
            exit 1
          fi
          mkdir -p app/src/main/assets
          code=$(curl -sSL -w '%{http_code}' -o app/src/main/assets/assets.pack \
            -H "Authorization: Bearer ${ASSETS_PAT}" \
            https://raw.githubusercontent.com/Klee7792/nainiuzhen-assets/main/assets.pack)
          if [ "${code}" != "200" ]; then
            echo "::error::assets.pack 拉取失败（HTTP ${code}）：检查 PAT 是否只授了 nainiuzhen-assets、私有仓 main 分支是否存在该文件"
            exit 1
          fi
          if ! head -c 4 app/src/main/assets/assets.pack | grep -q "NZPK"; then
            echo "::error::assets.pack 魔数校验失败（非 NZPK 容器，可能下载到错误页）"
            exit 1
          fi
          echo "::notice::assets.pack 注入完成：$(wc -c < app/src/main/assets/assets.pack) 字节"
          # release 签名复用 Android 标准 debug keystore（与本地构建同签名，可覆盖互装）。
          # 本地 keystore 存私有素材仓，CI 拉到 runner 的 ~/.android/ 下供 validateSigningRelease 使用。
          mkdir -p "${HOME}/.android"
          code2=$(curl -sSL -w '%{http_code}' -o "${HOME}/.android/debug.keystore" \
            -H "Authorization: Bearer ${ASSETS_PAT}" \
            https://raw.githubusercontent.com/Klee7792/nainiuzhen-assets/main/debug.keystore)
          if [ "${code2}" != "200" ]; then
            echo "::error::debug.keystore 拉取失败（HTTP ${code2}）"
            exit 1
          fi
          echo "::notice::debug.keystore 就绪：$(wc -c < "${HOME}/.android/debug.keystore") 字节"

      # 版本号由前置 version job 计算并通过属性覆盖注入。
      # 注意：checkout 检出的是触发本次 run 的 sha，不含 version job 刚 push 的新台账，
      #       因此这里必须用 -PncVersionCode/-PncVersionName 覆盖（app/build.gradle.kts 属性优先）。
      - name: Build
        run: >-
          gradle :app:assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
          -PncVersionCode=${{ needs.version.outputs.android_code }}
          -PncVersionName=${{ needs.version.outputs.android_name }}
          --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nainiuzhen-baike-android-${{ needs.version.outputs.android_name }}-${{ inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # ───────────────────────── iOS（未签名 ipa · 巨魔侧载） ─────────────────────────
  # 产物为未签名 .ipa（CODE_SIGNING_ALLOWED=NO），供 TrollStore 直接侧载，无需任何证书。
  # 版本号统一由前置 version job 从 builds/ios_build_number.txt 读取（与 Android 各自独立计数）。
  ios:
    name: iOS ipa
    needs: version
    if: ${{ inputs.ios }}
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 仓库没有 wrapper，直接装指定版本 Gradle（Xcode 的 Compile Kotlin 脚本阶段也会用到）。
      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      # 素材与 Android job 同源：私有仓 main 分支 assets.pack，缺包 = 启动空数据，硬失败。
      - name: Fetch game assets pack
        env:
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
        run: |
          if [ -z "${ASSETS_PAT}" ]; then
            echo "::error::未配置 Secret ASSETS_PAT"
            exit 1
          fi
          code=$(curl -sSL -w '%{http_code}' -o iosApp/iosApp/assets.pack \
            -H "Authorization: Bearer ${ASSETS_PAT}" \
            https://raw.githubusercontent.com/Klee7792/nainiuzhen-assets/main/assets.pack)
          if [ "${code}" != "200" ]; then
            echo "::error::assets.pack 拉取失败（HTTP ${code}）"
            exit 1
          fi
          if ! head -c 4 iosApp/iosApp/assets.pack | grep -q "NZPK"; then
            echo "::error::assets.pack 魔数校验失败（非 NZPK 容器）"
            exit 1
          fi
          echo "::notice::assets.pack 注入完成：$(wc -c < iosApp/iosApp/assets.pack) 字节"

      # 版本号已由前置 version job 计算（needs.version.outputs.ios_name / ios_code）：
      #   builds/ios_build_number.txt 存「当前版本号」，勾选 +1 时由 version job 回写。
      # 未签名真机包：xcodebuild 会经 Compile Kotlin 脚本阶段调 gradle 产出并链接 Kotlin framework。
      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT="$PWD/iosApp/build/Build/Products" \
            OBJROOT="$PWD/iosApp/build/Build/Intermediates.noindex" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ needs.version.outputs.ios_name }} \
            CURRENT_PROJECT_VERSION=${{ needs.version.outputs.ios_code }} \
            build

      # CgBI 双保险：即使 COMPRESS_PNG_FILES=NO 失效，也用仓库原始 PNG 覆盖 bundle 里的
      # 副本（pngcrush 产物 Skia 解不了 → 关于页/加载页图标白图）。并打印字节头留证。
      - name: Restore pristine launcher icon in .app
        run: |
          app=$(ls -d iosApp/build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error::未找到 .app（Restore pristine launcher icon）"
            exit 1
          fi
          echo "bundle 内 ic_launcher.png 字节头（覆盖前）:"
          xxd -l 16 "$app/ic_launcher.png" || true
          cp iosApp/iosApp/ic_launcher.png "$app/ic_launcher.png"
          echo "覆盖后字节头（应为 89504e470d0a1a0a = 标准 PNG）:"
          xxd -l 16 "$app/ic_launcher.png"

      - name: Package unsigned .ipa
        run: |
          # 产物名 = PRODUCT_NAME = nainiuzhenbaike（见 project.pbxproj）；用通配兜底，
          # 万一改名未同步也不会静默打出错误名字的包。
          app=$(ls -d iosApp/build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::error::未找到 Release-iphoneos 下的 .app，构建产物异常"
            exit 1
          fi
          echo "::notice::打包产物：$(basename "$app")"
          mkdir -p iosApp/build/Payload
          cp -R "$app" iosApp/build/Payload/
          cd iosApp/build
          zip -qry "nainiuzhen-baike_v${{ needs.version.outputs.ios_name }}_ios.ipa" Payload
          ls -lh *.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: nainiuzhen-baike-ios-${{ needs.version.outputs.ios_name }}
          path: iosApp/build/*.ipa
          if-no-files-found: error

  # ─────────────────── 桌面端（占位，共用检查） ───────────────────
  desktop-windows:
    name: Windows exe
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target check
        shell: bash
        run: |
          if [ ! -d shared/src/jvmMain ]; then
            echo "::error::桌面端（Compose Desktop / shared/src/jvmMain）尚未实装。"
            exit 1
          fi
      # TODO: gradle packageExe（installMSI/packageDistributionForCurrentTests）→ 上传

  desktop-macos:
    name: macOS dmg
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target check
        run: |
          if [ ! -d shared/src/jvmMain ]; then
            echo "::error::桌面端（Compose Desktop / shared/src/jvmMain）尚未实装。"
            exit 1
          fi
      # TODO: gradle packageDmg → 上传

  desktop-linux:
    name: Linux deb/AppImage
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target check
        run: |
          if [ ! -d shared/src/jvmMain ]; then
            echo "::error::桌面端（Compose Desktop / shared/src/jvmMain）尚未实装。"
            exit 1
          fi
      # TODO: gradle packageDeb packageAppImage → 上传
